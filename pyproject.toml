[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta" 

[project]
name = "firepeaks" 
version = "0.1.0" 
requires-python = ">=3.10"
dependencies =["numpy", "pandas", "geopandas", "shapely>=2", "scipy", "pyarrow", "pyyaml", "s3fs", "xarray", "zarr"]

[tool.setuptools]
packages = ["firepeaks"]

