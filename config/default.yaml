paths: 
  sites: inputs/sites.csv
  basins: inputs/gagesii_basins.gpkg
  mtbs: inputs/mtbs_perims_DD.shp
  event_table: inputs/Full_Attribute_Tabel_992026.csv
  s01: outputs/01_sites
  s02: outputs/02_peaks
  s03: outputs/03_precip 
  s04: outputs/04_windows
  s05: outputs/05_metrics
  iv_cache: cache/nwis_iv
  peak_cache: cache/nwis_peaks
  snow_table: inputs/snow_pct.csv

peaks: 
  pot_rate: 5           #threshold = flow independent peaks exceed 5x/yr
  min_sep_h: 12
  trough_ratio: 0.75
  min_years: 5           #shorter pre-fire records get no threshold
  recovery_years: 3      # masked from pre-fire record
  record_start: "1980-01-01"
  nwis_match_days: 1 
  fetch_iv: false        # true pulls NWIS IV, slow only change if needed 

filters: 
  snow_pct_min: 15.0
  ac24_min: 0.3
  prom_min: 0.5

sites: 
  area_tolerance: 0.10

fires: 
  min_burned_pct: 5.0          # fires that get a post-fire search 
  mask_min_percent: 5.0             # could potentially change what earlier fires are masked from the pre-burned record? 
  post_fire_yrs: 3               
  wildfire_only: true               # MTBS records Incid_Type, ensure these are only wildfires

